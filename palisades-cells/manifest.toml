[module.params.place]
lat_n = 34.16
lat_s = 34
lon_e = -118.46
lon_w = -118.72
res_arcsec = 1

[[module]]
name = "record"
kind = "obs.record"

[module.params]
files = [
    "palisades-2025/nifc/palisades-event-points.geojson",
    "palisades-2025/nifc/palisades-event-lines.geojson",
]
