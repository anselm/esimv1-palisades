[module.params.place]
lat_n = 34.16
lat_s = 34
lon_e = -118.46
lon_w = -118.72
res_arcsec = 1

[[module]]
name = "obs"
kind = "obs.perimeters"

[module.params]
incident = "Palisades"
irwin = "{A7EA5D21-F882-44B8-BF64-44AB11059DC1}"
year = 2025

[module.params.place]
lat_n = 34.16
lat_s = 34
lon_e = -118.46
lon_w = -118.72
res_arcsec = 1

[[module]]
name = "seen"
kind = "obs.hotspots"

[module.params]
end = "2025-01-12T00:00:00Z"
every = "1h"
file = "palisades-2025/viirs/hotspots.csv"
frame_res_arcsec = 3
land_only = true
series = "seen"
start = "2025-01-07T18:00:00Z"

[module.params.place]
lat_n = 34.16
lat_s = 34
lon_e = -118.46
lon_w = -118.72
res_arcsec = 1

[[module]]
name = "structures"
kind = "obs.dins"

[module.params]
key = "cal-fire-dins/2025-palisades"
